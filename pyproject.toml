[project]
name = "repo-expert"
version = "0.1.0"
description = "Agentic RAG that answers questions about any GitHub repo (Azure AI Search + LangGraph)"
readme = "README.md"
authors = [
    { name = "Jorge Pulgar", email = "jpulgar111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-search-documents>=12.0.0",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
repo-expert = "repo_expert:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
